name: Weekly cross-platform growth report
on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"
permissions:
  contents: read
concurrency:
  group: mr-nextep-growth-report
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      META_GRAPH_API_VERSION: ${{ vars.META_GRAPH_API_VERSION || 'v21.0' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Refresh YouTube Analytics
        continue-on-error: true
        run: |
          if ! python scripts/pull_analytics.py --lookback-days 90; then
            echo "::warning title=YouTube Analytics::Refresh failed; report will show the last cached data or no data."
          fi
      - name: Refresh Meta insights and build unified report
        run: python scripts/pull_platform_analytics.py
      - name: Upload report artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mr-nextep-weekly-growth-report
          if-no-files-found: warn
          path: |
            output/weekly_growth_report.md
            output/weekly_growth_report.json
