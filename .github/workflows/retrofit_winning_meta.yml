name: Retrofit Winning Metadata (YouTube & Meta)
on:
  workflow_dispatch:
    inputs:
      apply_changes:
        description: Apply metadata changes to live videos
        type: boolean
        required: true
        default: false
      confirm_changes:
        description: Confirm that live metadata updates are intended
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  retrofit:
    runs-on: ubuntu-latest
    steps:
      - name: Reject unconfirmed live changes
        if: ${{ inputs.apply_changes && !inputs.confirm_changes }}
        run: |
          echo "::error::Live metadata changes require both confirmation inputs."
          exit 1
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install google-api-python-client google-auth-oauthlib requests
      - name: Preview metadata changes
        if: ${{ !inputs.apply_changes }}
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: python scripts/optimize_mrnextep_videos.py
      - name: Apply confirmed live metadata changes
        if: ${{ inputs.apply_changes && inputs.confirm_changes }}
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: python scripts/optimize_mrnextep_videos.py --apply --confirm
