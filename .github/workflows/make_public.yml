name: Instant Make Public

on:
  workflow_dispatch:
    inputs:
      confirm_publication:
        description: "Confirm that the selected videos should become public immediately"
        required: true
        type: boolean
        default: false
      video_ids:
        description: "Explicit comma-separated YouTube video IDs to make public immediately"
        required: true
        type: string
        default: ""

permissions:
  contents: read

jobs:
  make-public:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run make public
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          VIDEO_IDS: ${{ inputs.video_ids }}
          CONFIRM_PUBLICATION: ${{ inputs.confirm_publication }}
        run: python scripts/make_public.py
