name: "MrNextep - YouTube Analytics Learning"

on:
  workflow_dispatch:
  schedule:
    # 2026-08-25: Heatmap-aligned. Run analytics at 1:00 PM PKT (= 8:00 AM
    # UTC = 3:00 AM ET) — after videos published at 1:30 PM ET previous day
    # have had 19h+ of data. Also runs before the next generation slot (9:00
    # UTC = 2:00 PM PKT) so fresh metrics feed into the next pipeline.
    - cron: "0 8 * * *"

permissions:
  contents: write

concurrency:
  # Shared with the publishing workflow so both jobs cannot rewrite data/
  # concurrently and lose fresh metrics or upload state.
  group: skillor-channel-state
  cancel-in-progress: false

jobs:
  update-analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install analytics dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            'google-api-python-client>=2.100.0' \
            'google-auth>=2.25.0' \
            'google-auth-oauthlib>=1.1.0' \
            'google-auth-httplib2>=0.2.0' \
            'numpy>=1.24.0' 'Pillow>=10.0.0' \
            'requests>=2.31.0' 'python-dotenv>=1.0.0' \
            'pytz>=2024.1' \
            'scikit-learn>=1.3.0'

      - name: Backfill any channel uploads missing from history
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        # Discover channel uploads before refreshing metrics so off-pipeline or
        # previously missed videos become eligible for learning immediately.
        run: python scripts/backfill_channel_uploads.py

      - name: Update real YouTube metrics
        env:
          VIDEO_HISTORY_PATH: data/video_history.json
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          FB_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        # Deliberately NOT swallowing failures any more. This step used to end
        # in `|| echo "::warning::..."`, so an expired token or a missing
        # analytics scope produced a GREEN run while the learning loop was
        # completely blind - the channel then made strategy decisions from stale
        # or empty data for weeks without anyone being told. A learning job that
        # cannot read metrics has failed, and must say so.
        run: python src/analytics_updater.py

      - name: Update Facebook Reels metrics (best effort)
        # Runs even when the YouTube learning step failed, so a Meta-side
        # refresh is never lost to an unrelated YouTube auth problem.
        if: always()
        env:
          FB_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          FB_API_VERSION: "v23.0"
          UPLOAD_STATE_PATH: data/upload_state.json
          FACEBOOK_ANALYTICS_PATH: data/facebook_analytics.json
        run: python scripts/update_facebook_analytics.py

      - name: Train ML models on real channel data (auto-pilot)
        # The learning loop wrote real metrics in the step above. Now the ML
        # brain trains its VIEW/CTR/retention ensemble models, reality
        # calibration and independent evaluator, and persists them so the
        # strategy engine's next decision uses trained models — not empty
        # heuristics. This is the step that makes the ML genuinely autonomous:
        # every daily sync improves the next video's decisions.
        if: always()
        env:
          VIDEO_HISTORY_PATH: data/video_history.json
        run: python scripts/train_ml.py 2>&1 | tail -25 || true

      - name: Persist analytics state
        if: always()
        run: |
          set -euo pipefail
          git config user.name "skillor-bot"
          git config user.email "skillor-bot@users.noreply.github.com"
          # IMPORTANT: do not reset data/ here. The analytics stages just wrote
          # fresh metrics, growth state, and model state. Resetting the folder
          # before staging silently discarded the learning loop's output and
          # produced green runs with stale or empty state.
          git add data/
          if git diff --cached --quiet; then
            echo "No analytics changes to persist."
            exit 0
          fi
          git commit -m "chore: update MrNextep analytics [skip ci]"
          # The publishing and analytics workflows share the same concurrency
          # group, but keep a bounded retry for a manual run or another writer.
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              exit 0
            fi
            echo "::warning::analytics state push attempt ${attempt} failed"
            sleep $((attempt * 5))
          done
          echo "::error::Could not persist fresh analytics state after 3 attempts"
          exit 1
