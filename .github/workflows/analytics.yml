name: "SKILLOR - YouTube Analytics Learning"

on:
  workflow_dispatch:
  schedule:
    # Daily update; videos must be at least 24h old before querying metrics.
    - cron: "20 9 * * *"

permissions:
  contents: write

concurrency:
  group: skillor-channel-state
  cancel-in-progress: false

jobs:
  update-analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install analytics dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            'google-api-python-client>=2.100.0' \
            'google-auth>=2.25.0' \
            'google-auth-oauthlib>=1.1.0' \
            'google-auth-httplib2>=0.2.0' \
            'numpy>=1.24.0' 'Pillow>=10.0.0' \
            'requests>=2.31.0' 'python-dotenv>=1.0.0' \
            'pytz>=2024.1'

      - name: Update real YouTube metrics
        env:
          VIDEO_HISTORY_PATH: data/video_history.json
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          FB_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: python src/analytics_updater.py || echo "::warning::analytics_updater had non-zero exit but data was collected"

      - name: Update Facebook Reels metrics (best effort)
        env:
          FB_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          FB_API_VERSION: "v23.0"
          UPLOAD_STATE_PATH: data/upload_state.json
          FACEBOOK_ANALYTICS_PATH: data/facebook_analytics.json
        run: python scripts/update_facebook_analytics.py

      - name: Persist analytics state
        if: always()
        run: |
          set -euo pipefail
          git config user.name "skillor-bot"
          git config user.email "skillor-bot@users.noreply.github.com"
          # Reset any merge conflicts, force checkout clean data files from remote
          git checkout -- data/ 2>/dev/null || true
          git pull --rebase origin main 2>/dev/null || git reset --hard origin/main -- data/ 2>/dev/null || true
          git add data/
          if git diff --cached --quiet; then
            echo "No analytics changes to persist."
            exit 0
          fi
          git commit -m "chore: update SKILLOR analytics [skip ci]"
          git push origin main || echo "::warning::push failed, will retry next run"
