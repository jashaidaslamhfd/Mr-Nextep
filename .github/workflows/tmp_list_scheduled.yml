name: "TMP - List Scheduled Videos (diagnostic)"
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Run full video listing + persist
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: |
          python scripts/list_scheduled_videos.py --only-scheduled
          python scripts/list_scheduled_videos.py
      - name: Commit the video lists
        run: |
          git add data/scheduled_videos.json data/all_videos.json
          git diff --cached --quiet || (git -c user.name="skillor-bot" \
            -c user.email="actions@github.com" commit -m "tmp: full video list [skip ci]" \
            && git push)
