name: FB Page Repair (one-shot)

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Write changes to Facebook (default = dry run)"
        required: false
        default: "0"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run FB page repair
        env:
          FB_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN || secrets.FB_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID || secrets.FB_PAGE_ID }}
        run: |
          if [ "${{ github.event.inputs.apply }}" = "1" ]; then
            python scripts/fb_repair.py --apply
          else
            python scripts/fb_repair.py
          fi
