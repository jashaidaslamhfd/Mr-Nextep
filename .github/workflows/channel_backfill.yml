name: "SKILLOR - Full Channel Backfill (YT+FB+IG)"

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "true = actually save; false = dry-run preview"
        required: true
        type: boolean
        default: false
      youtube_only:
        description: "Only YouTube (skip FB/IG)"
        required: false
        type: boolean
        default: false
      retrain:
        description: "Retrain ML Brain after backfill"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pytz python-dotenv Pillow numpy
      - name: Channel Backfill
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          FB_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FB_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: |
          ARGS=""
          if [ "${{ inputs.apply }}" = "true" ]; then ARGS="$ARGS --apply"; fi
          if [ "${{ inputs.youtube_only }}" = "true" ]; then ARGS="$ARGS --youtube-only"; fi
          if [ "${{ inputs.retrain }}" = "true" ]; then ARGS="$ARGS --retrain"; fi
          python scripts/channel_backfill.py $ARGS
      - name: Persist backfill data
        if: inputs.apply == true
        run: |
          git config user.name "skillor-bot"
          git config user.email "skillor-bot@users.noreply.github.com"
          git add data/video_history.json data/platform_metrics.json data/backfill_log.json data/ml_brain_state.json data/growth_state.json 2>/dev/null || true
          if [ -z "$(git diff --cached --name-only)" ]; then echo "No changes."; exit 0; fi
          git commit -m "chore: full channel backfill - YT+FB+IG data [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && break
            sleep $((i*5))
          done
      - name: Upload backfill log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backfill-log-${{ github.run_id }}
          path: data/backfill_log.json
          if-no-files-found: ignore
          retention-days: 30
