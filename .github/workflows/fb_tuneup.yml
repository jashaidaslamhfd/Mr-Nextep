name: FB Page Tune-Up (one-shot)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only (no writes)"
        required: false
        default: "0"

permissions:
  contents: write

jobs:
  tuneup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run FB page tune-up
        env:
          FB_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN || secrets.FB_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID || secrets.FB_PAGE_ID }}
          FB_API_VERSION: ${{ vars.FB_API_VERSION }}
          FB_TUNEUP_DRY: ${{ github.event.inputs.dry_run }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: python scripts/fb_page_tuneup.py
      - name: Persist tune-up report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/fb_tuneup_*.json data/fb_thumbs_done.json 2>/dev/null || git add data/fb_tuneup_*.json
          if git diff --cached --quiet; then echo "no changes"; else
            git commit -m "chore: fb tune-up report [skip ci]"
            for i in 1 2 3; do
              git pull --rebase --autostash && git push && break
              echo "push race — retry $i"; sleep 8
            done
          fi
