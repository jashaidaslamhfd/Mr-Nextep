name: TEMP - Test avatar pipeline
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  test-avatar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install ffmpeg
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg
      - name: Set up avatar models (OpenVoice + SadTalker)
        run: |\n          if ! bash scripts/setup_avatar_models.sh > /tmp/mrnextep-avatar-setup.log 2>&1; then\n            echo "::error::Avatar model setup failed; detailed logs were suppressed to avoid exposing credentials."\n            exit 1\n          fi
      - name: Run avatar pipeline test
        run: python scripts/test_avatar_pipeline.py
