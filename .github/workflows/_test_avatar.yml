name: TEMP - Test avatar pipeline
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  test-avatar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install ffmpeg
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg
      - name: Set up avatar models (OpenVoice + SadTalker)
        run: bash scripts/setup_avatar_models.sh 2>&1 | tee data/_avatar_test_setup.log
      - name: Commit setup log (always, even on failure)
        if: always()
        run: |
          mkdir -p data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/_avatar_test_setup.log
          git commit -m "chore: avatar setup log (debug)" || true
          git push origin HEAD || true
      - name: Run avatar pipeline test
        run: python scripts/test_avatar_pipeline.py
