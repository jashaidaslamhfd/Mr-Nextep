name: TEMP - Test avatar pipeline
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  test-avatar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install ffmpeg
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg
      - name: Set up avatar models (OpenVoice + SadTalker)
        run: |
          if ! bash scripts/setup_avatar_models.sh > /tmp/mrnextep-avatar-setup.log 2>&1; then
            echo "::error::Avatar model setup failed; detailed logs were suppressed to avoid exposing credentials."
            exit 1
          fi
      - name: Run avatar pipeline test
        run: python scripts/test_avatar_pipeline.py
