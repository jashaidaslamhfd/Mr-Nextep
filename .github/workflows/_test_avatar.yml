name: TEMP - Test avatar pipeline
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  test-avatar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install ffmpeg
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg
      - name: Set up avatar models (OpenVoice + SadTalker)
        run: bash scripts/setup_avatar_models.sh 2>&1 | tee data/_avatar_test_setup.log
      - name: Upload setup log for private debugging
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: avatar-setup-log
          path: data/_avatar_test_setup.log
          if-no-files-found: ignore
      - name: Run avatar pipeline test
        run: python scripts/test_avatar_pipeline.py
