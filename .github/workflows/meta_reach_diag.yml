name: "Meta Reach Diagnostic (read-only)"

# Answers the one question no existing tool could: are the low FB/IG view
# counts a DISTRIBUTION problem (Meta barely shows the Reel) or a RETENTION
# problem (it gets shown, viewers swipe away)? The deciding number is
# Instagram's ig_reels_avg_watch_time, which nothing in this repo had ever
# fetched. Read-only.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Meta reach diagnostic
        env:
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN || secrets.FB_ACCESS_TOKEN }}
          FB_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN || secrets.FB_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID || secrets.FB_PAGE_ID }}
          FB_API_VERSION: ${{ vars.FB_API_VERSION }}
        run: python scripts/meta_reach_diag.py
      - name: Persist snapshot
        if: always()
        run: |
          git config user.name "skillor-bot"
          git config user.email "skillor-bot@users.noreply.github.com"
          git add data/meta_reach_diag.json 2>/dev/null || true
          git diff --cached --quiet || {
            git commit -m "chore: meta reach diagnostic snapshot [skip ci]"
            git pull --rebase --autostash || true
            git push
          }
