name: FB Page Diagnostic (one-shot)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run FB diagnostic (read-only)
        env:
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_API_VERSION: ${{ vars.FB_API_VERSION }}
        run: python scripts/fb_page_diag.py
      - name: Persist diagnostic result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/fb_diag_*.json
          if git diff --cached --quiet; then echo "no changes"; else
            git commit -m "chore: fb diagnostic snapshot [skip ci]"
            git pull --rebase --autostash || true
            git push
          fi
