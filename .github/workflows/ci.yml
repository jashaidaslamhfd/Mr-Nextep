name: CI - guard tests on push

# Every push must pass the test suite BEFORE a scheduled pipeline run can
# break on it. If a commit would crash the daily pipeline, this fails loud
# here instead of silently killing uploads at 19:00 Paris time.
#
# Pull requests are tested too. Without the pull_request trigger a PR showed
# no checks at all, so a change could be reviewed and merged with nothing
# verifying it — the exact gap this workflow exists to close.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps (no heavy torch stack)
        run: |
          python -m pip install --upgrade pip
          for i in 1 2 3; do python -m pip install -r requirements.txt && break || { echo retry; sleep 10; }; done
          python -m pip install pytest
      - name: Compile gate (syntax crash-landed commits die here)
        run: python -m compileall -q src scripts
      - name: Run test suite
        run: python -m pytest tests/ -q
