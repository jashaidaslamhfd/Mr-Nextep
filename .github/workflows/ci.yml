name: CI

# Runs on every push and pull request. The pipeline workflow only triggers on a
# schedule, so before this existed breakage surfaced at publish time rather than at
# commit time — which is how a syntax-invalid entrypoint and a contradictory import
# graph both reached main unnoticed.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff
      - name: Byte-compile every module
        # Catches a file that is not valid Python at all — e.g. a patch blob
        # committed verbatim instead of applied.
        run: python -m compileall -q src scripts tests
      - name: Lint
        run: ruff check src scripts tests
      - name: Run tests
        run: python -m pytest -q
