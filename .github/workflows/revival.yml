name: "♻️ Revival — Old Video Revival"
on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  revival-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Python deps
        run: python -m pip install pytz requests

      - name: Run revival cycle
        env:
          FB_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          FB_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        run: |
          python3 - <<'PY'
          import json
          import sys
          sys.path.insert(0, '.')
          from src.revival import run_revival_cycle
          print(json.dumps(run_revival_cycle(), indent=2, default=str))
          PY

      - name: Reshare IG stories (if queued)
        if: success()
        env:
          IG_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from src.revival import _load_json, REVIVAL_STATE_PATH
          from src.revival_reshare import reshare_ig_to_stories
          state = _load_json(REVIVAL_STATE_PATH, {})
          today = datetime.now(timezone.utc).strftime('%Y-%m-%d')
          stories = [s for s in state.get('stories_reshared_today', []) if s.get('date') == today]
          results = [{'reel_id': s['reel_id'], 'success': reshare_ig_to_stories(s['reel_id'], __import__('os').environ.get('IG_ACCESS_TOKEN', ''))} for s in stories]
          print(json.dumps(results, indent=2))
          PY

      - name: Reshare FB stories (if queued)
        if: success()
        env:
          FB_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from src.revival import _load_json, REVIVAL_STATE_PATH
          from src.revival_reshare import reshare_fb_to_stories
          state = _load_json(REVIVAL_STATE_PATH, {})
          today = datetime.now(timezone.utc).strftime('%Y-%m-%d')
          stories = [s for s in state.get('stories_reshared_today', []) if s.get('date') == today]
          results = [{'reel_id': s['reel_id'], 'success': reshare_fb_to_stories(s['reel_id'], os.environ.get('FB_ACCESS_TOKEN', ''))} for s in stories]
          print(json.dumps(results, indent=2))
          PY

      - name: Commit state changes
        if: success()
        run: |
          git config user.name "Revival Bot"
          git config user.email "bot@nextep.ai"
          git add data/revival_state.json data/revival_queue.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update revival state [skip ci]"
            git push
          fi

      # Avoid exposing credentials in shell command arguments or logs.
      # The Python blocks read tokens from environment variables only.
