name: "SKILLOR - Dead Content Cleanup (FB+IG+YT)"

on:
  workflow_dispatch:
    inputs:
      delete_fb:
        description: "Delete dead FB reels (0-3 views)"
        required: false
        type: boolean
        default: false
      delete_ig:  
        description: "Delete dead IG reels (0-30 reach)"
        required: false
        type: boolean
        default: false
      fix_yt:
        description: "Fix dead YT titles + descriptions"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests

      - name: Cleanup Facebook Dead Reels
        if: inputs.delete_fb == true
        env:
          FB_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        run: |
          python3 << 'PYEOF'
import requests, json, time, os
TOK = os.environ["FB_TOKEN"]
PAGE = os.environ.get("PAGE_ID", "1122980080905302")

# Get all reels
r = requests.get(f"https://graph.facebook.com/v23.0/{PAGE}/videos?fields=id,title,views&limit=50&access_token={TOK}")
reels = r.json().get("data", [])
dead = [rl for rl in reels if (rl.get("views",0) or 0) <= 3]
print(f"Total: {len(reels)} | Dead: {len(dead)}")

deleted = 0
for i, rl in enumerate(dead):
    resp = requests.delete(f"https://graph.facebook.com/v23.0/{rl['id']}?access_token={TOK}")
    if resp.status_code == 200 or resp.text == "{}":
        deleted += 1
        print(f"  ✅ [{i+1}/{len(dead)}] {rl.get('title','?')[:50]}")
    else:
        err = resp.json().get("error",{}).get("message","?")
        print(f"  ❌ [{i+1}/{len(dead)}] {err[:60]}")
    time.sleep(0.5)
print(f"\nDeleted: {deleted}/{len(dead)}")
PYEOF

      - name: Cleanup Instagram Dead Reels
        if: inputs.delete_ig == true
        env:
          FB_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          IG_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: |
          python3 << 'PYEOF'
import requests, json, time, os
TOK = os.environ["FB_TOKEN"]
IG = os.environ.get("IG_ID", "17841419734693464")

r = requests.get(f"https://graph.facebook.com/v23.0/{IG}/media?fields=id,caption,insights.metric(reach)&limit=25&access_token={TOK}")
media = r.json().get("data",[])
dead = []
for m in media:
    ins = m.get("insights",{}).get("data",[])
    reach = 0
    for i in ins:
        if i.get("name")=="reach":
            reach = (i.get("values",[{}])[0].get("value",0) or 0)
    if reach <= 30:
        dead.append((m["id"], reach, (m.get("caption","") or "")[:40]))
print(f"Total: {len(media)} | Dead: {len(dead)}")

deleted = 0
for mid, reach, cap in dead:
    resp = requests.delete(f"https://graph.facebook.com/v23.0/{mid}?access_token={TOK}")
    if resp.status_code == 200 or resp.text == "{}":
        deleted += 1
        print(f"  ✅ reach={reach} | {cap}")
    else:
        print(f"  ❌ {resp.json().get('error',{}).get('message','?')[:60]}")
    time.sleep(0.4)
print(f"\nDeleted: {deleted}/{len(dead)}")
PYEOF

      - name: Fix YouTube Dead Titles
        if: inputs.fix_yt == true
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: |
          python3 << 'PYEOF'
import json, os, requests, time
CID = os.environ["GOOGLE_CLIENT_ID"]
CSEC = os.environ["GOOGLE_CLIENT_SECRET"]
RTOK = os.environ["REFRESH_TOKEN"]

# Get access token
r = requests.post("https://oauth2.googleapis.com/token", data={
    "client_id": CID, "client_secret": CSEC,
    "refresh_token": RTOK, "grant_type": "refresh_token"
})
token = r.json().get("access_token","")

# Load video history
with open("data/video_history.json") as f:
    vh = json.load(f)

yt_vids = [v for v in vh if v.get("youtube_id") and (v.get("views",0) or 0) <= 100]
print(f"YouTube dead/low: {len(yt_vids)}")

fixed = 0
for v in yt_vids[:20]:  # Limit to 20 per run
    vid = v["youtube_id"]
    topic = v.get("topic", v.get("youtube_title", ""))
    
    # Generate better title
    t = topic.lower()
    if "your body does this" in t:
        new_title = "Your Body " + " ".join(w.capitalize() for w in t.split(":")[-1].strip().split() if len(w)>2) + " — Explained"
    elif t.startswith("why "):
        new_title = "Why " + t[4:].capitalize().rstrip("#shorts").strip()
    else:
        new_title = "Your " + t.capitalize().rstrip("#shorts").strip()
    
    new_title = new_title[:100]
    
    resp = requests.put("https://www.googleapis.com/youtube/v3/videos", params={"part":"snippet"}, json={
        "id": vid, "snippet": {"title": new_title, "categoryId": "27"}
    }, headers={"Authorization": f"Bearer {token}"}, timeout=15)
    
    if resp.status_code < 400:
        fixed += 1
        print(f"  ✅ {vid[:12]} → {new_title[:60]}")
    else:
        print(f"  ❌ {vid[:12]} → {resp.json().get('error',{}).get('message','?')[:50]}")
    time.sleep(0.3)

print(f"\nFixed: {fixed}")
PYEOF

      - name: Persist cleanup log
        if: always()
        run: |
          git config user.name "skillor-bot"
          git config user.email "skillor-bot@users.noreply.github.com"
          git add data/ 2>/dev/null || true
          git diff --cached --quiet && echo "No changes." && exit 0
          git commit -m "chore: dead content cleanup [skip ci]"
          git push origin main || echo "push failed, ok"
