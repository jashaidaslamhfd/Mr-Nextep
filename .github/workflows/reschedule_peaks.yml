name: "Reschedule pending videos to peak slots (US)"
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Set 'yes' to apply changes (empty = dry-run)"
        required: false
        type: string
permissions:
  contents: read
jobs:
  reschedule:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Reschedule to peaks
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          args=""
          [ "${{ inputs.apply }}" = "yes" ] && args="--apply"
          python scripts/reschedule_to_peaks.py $args
