name: "FB Token Diag (mobile-friendly)"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: pip install -q requests

      - name: Run FB token diagnostic
        env:
          # pehle FACEBOOK_ACCESS_TOKEN, warna FB_ACCESS_TOKEN
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          FB_API_VERSION: ${{ vars.FB_API_VERSION || 'v23.0' }}
        run: python scripts/fb_token_diag.py
