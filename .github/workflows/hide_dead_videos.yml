name: "SKILLOR - Hide Dead/Duplicate Videos (one-shot)"

# 2026-08-15: YouTube's API deliberately refuses permanent deletion, but it
# DOES allow privacy updates. This one-shot run sets the flagged dead-weight
# and duplicate videos to PRIVATE so they disappear from the channel page,
# search and the feed. Any ID that returns videoNotFound (already deleted or
# stale) is counted as done. To permanently delete still-existing videos,
# open YouTube Studio → Content → select them → Delete. (Private is fully
# reversible from Studio.)
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hide:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Google client
        shell: bash
        run: |
          python3 -m pip install -q --user google-api-python-client google-auth-oauthlib
          echo "PYTHONPATH=$HOME/.local/lib/python3.11/site-packages" >> "$GITHUB_ENV"

      - name: Hide the 8 flagged videos
        shell: bash
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: |
          set -u
          python3 - "$GOOGLE_CLIENT_ID" "$GOOGLE_CLIENT_SECRET" "$REFRESH_TOKEN" <<'PYEOF'
          import os, sys
          import google.oauth2.credentials as _creds
          from googleapiclient.discovery import build
          from googleapiclient.errors import HttpError

          cid, csec, token = sys.argv[1], sys.argv[2], sys.argv[3]
          if not all((cid, csec, token)):
              print("::error::Google secrets missing (GOOGLE_CLIENT_ID/SECRET, REFRESH_TOKEN)")
              sys.exit(1)

          # The stored secret is the long-lived refresh token; pass it as
          # refresh_token AND initial access token so google-auth has all
          # four fields (token, refresh_token, client_id, client_secret)
          # needed to mint a fresh access token.
          credentials = _creds.Credentials(
              token=None,
              refresh_token=token,
              client_id=cid,
              client_secret=csec,
              token_uri="https://oauth2.googleapis.com/token",
          )
          yt = build("youtube", "v3", credentials=credentials)

          # Dead weight (3) + duplicates (5), from data/video_classification.json
          videos = [
              ("cGVDXd8HN4g", "Why Got Fired Matters"),
              ("sOr6elVnTKc", "Body Twitches When You Sleep (Truth)"),
              ("27hVE-JDIAk", "Pulse Changes When You Lie"),
              ("u1eCpGU38PI", "Brain Freeze (dup, 139v)"),
              ("ZHdmd_YfxgM", "Freezes When Scared (dup, 198v)"),
              ("taTQG0-zVgg", "Freezes When Scared (dup, 663v)"),
              ("gjpntlEBT-c", "Freezes When Scared (dup, 0v)"),
              ("kLzNZVoP8Bo", "Twitches Every Time (dup, 0v)"),
          ]

          ok, fail = [], []
          for vid, label in videos:
              try:
                  yt.videos().update(
                      part="status",
                      body={"id": vid, "status": {"privacyStatus": "private"}},
                  ).execute()
                  print(f"OK   {vid}  {label}")
                  ok.append(vid)
              except HttpError as exc:
                  reason = str(exc).split("'reason': ")[1].split("'")[0] if "'reason': " in str(exc) else ""
                  if reason == "videoNotFound":
                      # Already deleted or invalid ID — video is gone from the
                      # channel either way, so the cleanup goal is achieved.
                      print(f"GONE {vid}  {label} (already deleted/invalid ID)")
                      ok.append(vid)
                  else:
                      print(f"FAIL {vid}  {label}: {exc}")
                      fail.append(vid)

          print(f"\n{len(ok)} hidden, {len(fail)} failed")
          sys.exit(1 if fail else 0)
          PYEOF
