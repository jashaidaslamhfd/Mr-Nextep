name: Mr-Nextep Shorts Factory
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Generate without YouTube upload
        required: true
        type: boolean
        default: true
      topic:
        description: Optional US-English dark-science topic
        required: false
        type: string
        default: ""
  schedule:
    # US audience is 64.7% of views. Generation starts two hours before each publish
    # peak so rendering and validation finish before the private video is scheduled.
    # Cron is UTC. Three daily generation runs:
    #   16:00 UTC = 9:00 PM PKT  (12:00 PM US Eastern)
    #   20:00 UTC = 1:00 AM PKT  (4:00 PM US Eastern)
    #   22:00 UTC = 3:00 AM PKT  (6:00 PM US Eastern)
    - cron: "0 16 * * *"
    - cron: "0 20 * * *"
    - cron: "0 22 * * *"
permissions:
  contents: write
concurrency:
  group: mr-nextep-production
  cancel-in-progress: false
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CHANNEL_LANGUAGE: en-US
      PUBLISH_TIMEZONE: America/New_York
      YT_PRIVACY_STATUS: private
      YT_SCHEDULE_PUBLISH: "true"
      DRY_RUN: ${{ inputs.dry_run || 'false' }}
      VIDEO_TOPIC: ${{ inputs.topic || '' }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      PUBLIC_VIDEO_URL: ${{ secrets.PUBLIC_VIDEO_URL }}
      META_POST_GAP_SECONDS: "60"
      INSTAGRAM_PROCESSING_TIMEOUT_SECONDS: "300"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Run preflight
        run: python scripts/preflight.py
      - name: Refresh USA trend queue
        # Previously suffixed with `|| true`, which hid a stale queue completely.
        # A fetch failure is now visible as a warning without failing the run.
        run: |
          if ! python scripts/fetch_usa_trends.py --output data/search_demand_queue_us.json --limit 30; then
            echo "::warning title=Trend queue::Trend refresh failed; continuing with the existing queue"
          fi
      - name: Run regression tests
        run: python -m pytest -q
      - name: Generate, validate and schedule
        run: python -m src.main
      - name: Upload debug artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mr-nextep-output
          if-no-files-found: ignore
          path: output/
