name: Mr-Nextep Shorts Factory
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Generate without YouTube upload
        required: true
        type: boolean
        default: true
      topic:
        description: Optional US-English dark-science topic
        required: false
        type: string
        default: ""
  schedule:
    # Heatmap is in PKT (GMT+5). Peak band is roughly 18:00–22:00 PKT.
    # Two daily publish peaks from the supplied heatmap, in PKT.
    # Sun/Sat 19:00 + 21:00; Mon–Thu 20:00 + 22:00; Fri 21:00 + 23:00.
    # Start two hours before each publish peak so generation and validation
    # finish before the private video is scheduled. Cron is UTC.
    - cron: "0 12 * * 0"
    - cron: "0 14 * * 0"
    - cron: "0 13 * * 1-4"
    - cron: "0 15 * * 1-4"
    - cron: "0 14 * * 5"
    - cron: "0 16 * * 5"
    - cron: "0 12 * * 6"
    - cron: "0 14 * * 6"
permissions:
  contents: write
concurrency:
  group: mr-nextep-production
  cancel-in-progress: false
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CHANNEL_LANGUAGE: en-US
      PUBLISH_TIMEZONE: America/New_York
      YT_PRIVACY_STATUS: private
      YT_SCHEDULE_PUBLISH: "true"
      DRY_RUN: ${{ inputs.dry_run || 'false' }}
      VIDEO_TOPIC: ${{ inputs.topic || '' }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      PUBLIC_VIDEO_URL: ${{ secrets.PUBLIC_VIDEO_URL }}
      META_POST_GAP_SECONDS: "600"
      INSTAGRAM_PROCESSING_WAIT_SECONDS: "60"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Generate, validate and schedule
        run: PYTHONPATH=src python src/main.py
      - name: Upload debug artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mr-nextep-output
          if-no-files-found: ignore
          path: output/
