name: Mr-Nextep Shorts Factory
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Generate without YouTube upload
        required: true
        type: boolean
        default: false
      force_publish:
        description: Bypass minimum publish gap guard
        required: false
        type: boolean
        default: false
      topic:
        description: Optional US-English dark-science topic
        required: false
        type: string
        default: ""
  schedule:
    # US audience is 64.7%+ of views. Published directly to public at peak US engagement
    # windows, spaced with at least 5 hours gap to prevent algorithm cannibalization:
    #   17:00 UTC = 1:00 PM US Eastern / 10:00 AM US Pacific (US Lunch Peak)
    #   22:00 UTC = 6:00 PM US Eastern / 3:00 PM US Pacific (US Evening / Commute Peak)
    #   03:00 UTC = 11:00 PM US Eastern / 8:00 PM US Pacific (US West Coast Prime / Bedtime Peak)
    - cron: "0 17 * * *"
    - cron: "0 22 * * *"
    - cron: "0 3 * * *"
permissions:
  contents: write
concurrency:
  group: mr-nextep-production
  cancel-in-progress: false
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CHANNEL_LANGUAGE: en-US
      PUBLISH_TIMEZONE: America/New_York
      YT_PRIVACY_STATUS: public
      YT_SCHEDULE_PUBLISH: "false"
      MIN_PUBLISH_GAP_HOURS: "4.0"
      FORCE_PUBLISH: ${{ inputs.force_publish || 'false' }}
      DRY_RUN: ${{ inputs.dry_run || 'false' }}
      VIDEO_TOPIC: ${{ inputs.topic || '' }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      PUBLIC_VIDEO_URL: ${{ secrets.PUBLIC_VIDEO_URL }}
      META_POST_GAP_SECONDS: "60"
      INSTAGRAM_PROCESSING_TIMEOUT_SECONDS: "300"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Run preflight
        run: python scripts/preflight.py
      - name: Refresh USA trend queue
        # Previously suffixed with `|| true`, which hid a stale queue completely.
        # A fetch failure is now visible as a warning without failing the run.
        run: |
          if ! python scripts/fetch_usa_trends.py --output data/search_demand_queue_us.json --limit 30; then
            echo "::warning title=Trend queue::Trend refresh failed; continuing with the existing queue"
          fi
      - name: Run regression tests
        run: python -m pytest -q
      - name: Generate, validate and direct-publish to YouTube
        run: python -m src.main
      - name: Upload debug artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mr-nextep-output
          if-no-files-found: ignore
          path: output/
