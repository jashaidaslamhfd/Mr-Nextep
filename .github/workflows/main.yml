name: "SKILLOR - YouTube Shorts Automation (US)"

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional video topic (empty = next Body Glitch episode)"
        required: false
        type: string
  schedule:
    # 3 videos/day for a US audience, auto-published at New York peaks:
    # 12:30 / 18:30 / 21:30 America/New_York (midday scroll + the two evening
    # peaks; the late slot publishes at 21:30 NY, inside the 7-10 PM
    # wind-down peak). Data: SocialPilot 301k videos + Hopper HQ 2026.
    - cron: "30 16 * * *"
    - cron: "30 22 * * *"
    - cron: "30 1 * * *"

permissions:
  contents: write

concurrency:
  group: skillor-pipeline
  cancel-in-progress: false

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 200

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Cache TTS model downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: skillor-tts-models-${{ runner.os }}-${{ hashFiles('requirements.txt') }}-v3
          restore-keys: |
            skillor-tts-models-${{ runner.os }}-

      - name: Install system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core espeak-ng
          python -m pip install --upgrade pip setuptools wheel
          for i in 1 2 3; do
            python -m pip install -r requirements.txt && break || {
              echo "Install retry $i"
              sleep 15
            }
          done

      - name: Run offline quality regression tests
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_body_glitch_topics.py
          python scripts/generate_mystery_music.py
          python -m compileall -q src scripts tests
          python -m unittest discover -s tests -v

      - name: Validate required secrets
        shell: bash
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          FB_UPLOAD_ENABLED: "true"
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: |
          set -euo pipefail
          echo "Checking required secrets..."
          missing=0
          [ -z "${GROQ_API_KEY:-}" ] && { echo "::error::GROQ_API_KEY missing"; missing=1; }
          for var in GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET REFRESH_TOKEN; do
            [ -z "${!var:-}" ] && { echo "::error::$var missing"; missing=1; }
          done
          if [ "${FB_UPLOAD_ENABLED,,}" = "true" ]; then
            [ -z "$FACEBOOK_PAGE_ID" ] || [ -z "$FACEBOOK_ACCESS_TOKEN" ] && { echo "::error::FB secrets missing"; missing=1; }
          fi
          exit "$missing"

      - name: Generate and upload Short
        shell: bash
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TREND_REGION: "US"
          YOUTUBE_REGION_CODE: "US"
          CHANNEL_LANGUAGE: "en-US"
          CONTENT_SERIES: "dark_mystery"
          TOPIC_STRATEGY: "dark_mystery_series"
          # 2026-08 retention-first pass: kill the emoji-title machine template
          # ("Why Your X 🫀" on 100+ videos) that 2026 template-detection
          # systems demote. Clean curiosity-question titles from here on.
          TITLE_EMOJI_OFF: "true"
          # 2026-08-15 Trend-Spiker overlay: every run scans public trend
          # feeds (Google Trends RSS + YouTube trending page, no keys). An
          # on-brand demand spike confirmed by 2+ independent signals
          # overrides this single slot's queue topic; otherwise the curated
          # series queue is used as usual.
          TREND_SPIKER_ENABLED: "true"
          TTS_ENGINE: "kokoro"
          KOKORO_LANG_CODE: "a"
          KOKORO_VOICE: "am_adam"
          # 2026-08 humanization: rotate the narrator per topic so the channel
          # does not sound like one frozen machine voice (5 male + 5 female EN
          # voices, seeded per topic — same topic keeps its narrator).
          VOICE_ROTATE: "auto"
          AI_HORDE_API_KEY: ${{ secrets.AI_HORDE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          YT_MADE_FOR_KIDS: "false"
          YT_DECLARE_SYNTHETIC_MEDIA: "true"
          YT_PLAYLIST_ENABLED: "true"
          YT_PRIVACY_STATUS: "private"
          YT_SCHEDULE_PUBLISH: "true"
          ENFORCE_POSTING_GAP: "true"
          FB_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FB_UPLOAD_ENABLED: "true"
          IG_UPLOAD_ENABLED: "true"
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          META_CUT_ENABLED: "true"
          # Force a shorter Facebook/Instagram cut to lift completion. Measured
          # Meta completion was 19-24% vs a 70%+ gate on a ~23s cut (avg watch
          # 2.6-7.5s). Completion = watch / length, so length is the free lever.
          # 18 was previously pinned AT the policy floor and therefore did
          # nothing; the floor is now 12s (see algorithm_policy.py) and 14s is
          # the data-backed target: 7.5s / 14s = 54% vs 42% at 18s.
          META_TARGET_SECONDS: "14"
          SPOKEN_CTA_MODE: "loop"
          REQUIRE_CLONED_VOICE: "false"
          MUSIC_VOLUME: "0.18"
          VIDEO_TOPIC: ${{ inputs.topic || '' }}
          # 2026-08-15: 8B hooks were the quality ceiling. 70B+ class writes
          # noticeably stronger hooks/titles (2026 feeds rank hook quality
          # hard). Groq's GPT-OSS 120B is the strongest free-tier model and
          # the account's live /models list is probed at runtime so a retired
          # id (e.g. llama-3.1-70b-instruct, 404'd Aug 14) can never stall
          # the whole run again.
          GROQ_MODEL: "openai/gpt-oss-120b"
          GROQ_MODEL_FALLBACK: "openai/gpt-oss-20b"
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # 2026-08-15: competitor hijacking (scraping rivals' comments/topics
          # for copycat content) targets YouTube's inauthentic-engagement
          # policy — a strike/demotion risk, never enabled in production.
          COMPETITOR_HIJACK_ENABLED: "false"
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "=== Attempt $attempt / 3 ==="
            if python src/main.py; then break
            else
              rc=$?; echo "::warning::Failed code $rc"
              if [ "$attempt" -eq 3 ]; then exit "$rc"; fi
              sleep $((attempt * 60))
            fi
          done

      - name: 2026 deep-repair all uploaded videos (metadata fix)
        if: always()
        shell: bash
        env:
          TITLE_EMOJI_OFF: "true"
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          FB_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FB_UPLOAD_ENABLED: "true"
          IG_UPLOAD_ENABLED: "true"
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -uo pipefail
          # YouTube: titles/descriptions/tags via API (no analytics scope needed)
          if [ -n "${GOOGLE_CLIENT_ID:-}" ] && [ -n "${REFRESH_TOKEN:-}" ]; then
            python scripts/deep_repair_2026.py --apply --youtube-only
          else
            echo "::warning::YouTube repair skipped: GOOGLE_CLIENT_ID/REFRESH_TOKEN secrets not set"
          fi
          # Facebook/Instagram: caption repairs via Graph API (token already
          # has pages_manage_engagement/instagram_manage_insights etc.)
          if [ -n "${FB_ACCESS_TOKEN:-}" ]; then
            python scripts/deep_repair_2026.py --apply --facebook-only || true
            python scripts/deep_repair_2026.py --apply --instagram-only || true
          else
            echo "::warning::Meta repair skipped: FACEBOOK_ACCESS_TOKEN secret not set"
          fi
      - name: Apply curated legacy-title repair plan
        if: always()
        shell: bash
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -uo pipefail
          if [ -n "${GOOGLE_CLIENT_ID:-}" ] && [ -n "${REFRESH_TOKEN:-}" ] && [ -f data/auto_repair_plan.json ]; then
            python scripts/apply_repair_plan.py || echo "::warning::Repair plan apply failed (see logs)"
          else
            echo "::notice::No repair plan or YouTube secrets — plan step skipped"
          fi

      - name: Persist durable channel state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- data/)" ]; then exit 0; fi
          git config user.name "skillor-bot"
          git config user.email "skillor-bot@users.noreply.github.com"
          git add -A data/
          git commit -m "chore: persist SKILLOR channel state [skip ci]"
          # Later steps (or a concurrent run's commit racing this one) can
          # leave unstaged files; stash them before pulling so 'pull --rebase'
          # never fails with 'You have unstaged changes'.
          git stash --quiet --include-untracked || true
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then break
            else sleep $((i * 5)); fi
          done
          git stash pop --quiet 2>/dev/null || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skillor-run-${{ github.run_id }}
          path: |
            output/
            pipeline.log
            data/
          if-no-files-found: ignore
          retention-days: 14
