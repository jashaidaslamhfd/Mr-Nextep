name: Mr-Nextep Shorts Factory
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Generate without YouTube upload
        required: true
        type: boolean
        default: true
      topic:
        description: Optional US-English dark-science topic
        required: false
        type: string
        default: ""
  schedule:
    - cron: "40 16 * * *"
    - cron: "10 22 * * *"
permissions:
  contents: write
concurrency:
  group: mr-nextep-production
  cancel-in-progress: false
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CHANNEL_LANGUAGE: en-US
      PUBLISH_TIMEZONE: America/New_York
      YT_PRIVACY_STATUS: private
      YT_SCHEDULE_PUBLISH: "true"
      DRY_RUN: ${{ inputs.dry_run || 'false' }}
      VIDEO_TOPIC: ${{ inputs.topic || '' }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Generate, validate and schedule
        run: PYTHONPATH=src python src/main.py
      - name: Upload debug artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mr-nextep-output
          if-no-files-found: ignore
          path: output/
