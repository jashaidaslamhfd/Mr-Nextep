name: "US SEO Sweep (descriptions + hashtags)"

# Repairs every published description on the US channel:
#   - "#brain facts" -> "#BrainFacts" (a hashtag cannot contain a space;
#     YouTube was parsing it as "#brain" plus a loose word)
#   - drops filler keywords ("having", "sudden", "charley") from the
#     "Learn the science behind ..." line
# Never touches titles. Never deletes. Dry-run by default.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "true = write to YouTube; false = dry-run preview"
        required: true
        default: false
        type: boolean
      limit:
        description: "Max videos (0 = all)"
        required: false
        default: "0"
        type: string

permissions:
  contents: read

concurrency:
  group: skillor-us-seo-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # stdlib-only script — nothing to install.
      - name: Sweep descriptions
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          CMD="python scripts/us_seo_sweep.py --limit ${{ inputs.limit }}"
          if [ "${{ inputs.apply }}" = "true" ]; then
            echo "::warning::APPLY mode - descriptions will be rewritten."
            CMD="$CMD --apply"
          else
            echo "Dry-run. Re-run with apply=true to write."
          fi
          $CMD

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: us-seo-sweep-${{ github.run_id }}
          path: output/us_seo_sweep.json
          if-no-files-found: ignore
