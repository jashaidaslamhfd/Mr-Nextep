name: "TMP - Duplicate Video Audit"
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Run duplicate audit + persist
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: python scripts/audit_duplicate_videos.py
      - name: Commit audit
        run: |
          git add data/duplicate_audit.json
          git diff --cached --quiet || (git -c user.name="skillor-bot" \
            -c user.email="actions@github.com" commit -m "tmp: duplicate audit [skip ci]" \
            && git push)
