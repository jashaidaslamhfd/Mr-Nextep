name: "MrNextep — Growth Loop (learn from all 3 platforms)"

# The feedback loop that makes the rest of the system adaptive.
#
# Every day this: pulls real numbers from YouTube, Facebook and Instagram,
# normalises them into one comparable store, learns which slots / topic
# pillars / hook frames actually retain viewers, and writes the decisions the
# generation pipeline reads on its next run.
#
# Runs at 00:30 UTC (19:30 NY) — after the previous day's 21:30 NY publish has
# had its first overnight hours to accumulate data, and before the first
# generation run of the day at 01:30 UTC, so today's videos are produced using
# yesterday's lesson rather than a day-old one.
#
# READ-ONLY against every platform. It cannot publish, edit or delete.

on:
  workflow_dispatch:
    inputs:
      min_hours:
        description: "Minimum video age in hours before metrics are trusted"
        required: false
        default: "24"
        type: string
  schedule:
    - cron: "30 0 * * *"

permissions:
  contents: write

concurrency:
  # Shares a group with the analytics workflow: both commit into data/, and
  # two concurrent runs would race on the same git push.
  group: skillor-channel-state
  cancel-in-progress: false

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install lightweight dependencies
        # Deliberately NOT requirements.txt: the learning loop needs HTTP and
        # the Google client, not torch/moviepy. Installing the full stack here
        # would add ~5 minutes per day for nothing.
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            'requests>=2.31.0' 'pytz>=2024.1' 'python-dotenv>=1.0.0' \
            'google-api-python-client>=2.100.0' 'google-auth>=2.25.0' \
            'google-auth-oauthlib>=1.1.0' 'google-auth-httplib2>=0.2.0'

      - name: Collect metrics, learn, and write the report
        env:
          # YouTube Analytics (needs yt-analytics.readonly on the refresh token
          # AND the Analytics API enabled in the Google Cloud project).
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          # Meta insights (needs read_insights + pages_read_engagement).
          FB_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN || secrets.FB_ACCESS_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN || secrets.FB_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          FB_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID || secrets.FB_PAGE_ID }}
          FB_API_VERSION: "v23.0"
          VIDEO_HISTORY_PATH: data/video_history.json
          UPLOAD_STATE_PATH: data/upload_state.json
          PLATFORM_METRICS_PATH: data/platform_metrics.json
          GROWTH_STATE_PATH: data/growth_state.json
          METRICS_MIN_HOURS: ${{ inputs.min_hours || '24' }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/growth_report.py

      - name: Persist learned state
        if: always()
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- data/ docs/GROWTH_REPORT.md)" ]; then
            echo "No new learning to persist."
            exit 0
          fi
          git config user.name "skillor-bot"
          git config user.email "skillor-bot@users.noreply.github.com"
          git add data/ docs/GROWTH_REPORT.md
          git commit -m "chore: update growth state and report [skip ci]"
          for i in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              break
            fi
            echo "Push retry $i"
            sleep $((i * 5))
            if [ "$i" -eq 3 ]; then
              echo "::warning::Growth state push failed after 3 tries; next run will redo it."
              exit 0
            fi
          done

      - name: Show the report in the run summary
        if: always()
        run: |
          if [ -f docs/GROWTH_REPORT.md ]; then
            cat docs/GROWTH_REPORT.md >> "$GITHUB_STEP_SUMMARY"
          fi
